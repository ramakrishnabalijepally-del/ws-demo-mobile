name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Read-only: the APK is kept as a private build artifact, never published
# to a public release.
permissions:
  contents: read

concurrency:
  group: "apk"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Release build. The app signs with the debug key (see
      # android/app/build.gradle.kts): this is a demo build meant to be
      # side-loaded, not a Play Store upload, so there is no keystore secret
      # to manage. Android will warn the installer that the developer is
      # unverified, which is expected.
      - run: flutter build apk --release

      # One universal APK rather than per-ABI splits, so the client has a
      # single file that installs on any phone.
      - name: Give the APK a human name
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/worksettle-demo.apk

      # Kept as a workflow artifact only, downloadable from the Actions run by
      # someone with repo access. The APK is handed to clients as a file, so
      # it is deliberately not attached to a public release.
      - uses: actions/upload-artifact@v4
        with:
          name: worksettle-demo-apk
          path: dist/worksettle-demo.apk
          retention-days: 30
