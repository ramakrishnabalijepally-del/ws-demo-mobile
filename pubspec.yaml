name: worksettle_mobile
description: WorkSettle — Canada's first AI platform for work and immigration settlement. Candidate mobile app.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.6.2
  flutter_riverpod: ^2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/hero_jobs.jpg
    - assets/images/hero_profile.jpg
    - assets/images/hero_success.jpg

